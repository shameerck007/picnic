<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Picnic Trip Manager</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f172a;--navy2:#1e293b;--navy3:#273548;
  --teal:#0d9488;--teal2:#14b8a6;
  --amber:#f59e0b;--coral:#f43f5e;--green:#10b981;--purple:#8b5cf6;--blue:#3b82f6;
  --border:rgba(255,255,255,0.08);--text:#f1f5f9;--muted:#94a3b8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--text);overflow-x:hidden;}
h1,h2,h3,h4,h5{font-family:'Outfit',sans-serif;}
input,select,textarea,button{font-family:'DM Sans',sans-serif;font-size:16px;}
button{cursor:pointer;min-height:44px;}
input,select{-webkit-appearance:none;appearance:none;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--teal);border-radius:4px;}

.page{display:none;min-height:100vh;}
.page.active{display:block;}

/* AUTH */
#auth-page{
  background:linear-gradient(135deg,#0f172a 0%,#1a2744 50%,#0f2d2a 100%);
  display:flex;align-items:center;justify-content:center;padding:20px;min-height:100vh;
}
.auth-card{
  background:rgba(30,41,59,0.95);border:1px solid rgba(13,148,136,0.3);
  border-radius:24px;padding:32px 24px;width:100%;max-width:420px;
  box-shadow:0 25px 60px rgba(0,0,0,0.5);
}
.auth-logo{
  width:64px;height:64px;background:linear-gradient(135deg,var(--teal),var(--teal2));
  border-radius:18px;display:flex;align-items:center;justify-content:center;
  font-size:28px;margin:0 auto 16px;box-shadow:0 8px 24px rgba(13,148,136,0.4);
}
.auth-title{font-size:24px;font-weight:800;text-align:center;margin-bottom:4px;}
.auth-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:24px;}
.tab-row{display:flex;background:rgba(255,255,255,0.05);border-radius:14px;padding:4px;gap:4px;margin-bottom:24px;}
.tab-btn{flex:1;padding:10px;border:none;border-radius:10px;font-weight:600;font-size:14px;background:transparent;color:var(--muted);transition:all 0.2s;}
.tab-btn.active{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;box-shadow:0 4px 12px rgba(13,148,136,0.35);}
.form-group{margin-bottom:14px;}
.field-label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;}
.field-input{
  width:100%;background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.1);
  border-radius:12px;padding:13px 16px;color:#fff;outline:none;transition:all 0.2s;
}
.field-input:focus{border-color:var(--teal);background:rgba(13,148,136,0.08);}
.field-input option{background:#1e293b;color:#fff;}
.primary-btn{
  width:100%;padding:14px;background:linear-gradient(135deg,var(--teal),var(--teal2));
  color:#fff;font-weight:700;font-size:15px;border:none;border-radius:12px;
  box-shadow:0 6px 20px rgba(13,148,136,0.35);transition:all 0.2s;
}
.primary-btn:active{transform:scale(0.98);}
.link-btn{background:none;border:none;color:var(--teal2);font-size:13px;font-weight:600;padding:8px 0;width:100%;cursor:pointer;}
.alert{border-radius:12px;padding:14px 16px;font-size:13px;margin-bottom:16px;display:none;}
.alert.show{display:block;}
.alert-ok{background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);color:#6ee7b7;}
.alert-err{background:rgba(244,63,94,0.1);border:1px solid rgba(244,63,94,0.3);color:#fda4af;}

/* APP */
#app-page{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));}
.topbar{
  background:rgba(15,23,42,0.97);border-bottom:1px solid var(--border);
  backdrop-filter:blur(20px);position:sticky;top:0;z-index:50;padding:12px 16px;
}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto;}
.topbar-logo{width:36px;height:36px;background:linear-gradient(135deg,var(--teal),var(--teal2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.topbar-title{font-family:'Outfit',sans-serif;font-weight:800;font-size:16px;line-height:1.1;}
.topbar-sub{font-size:11px;color:var(--muted);}
.btn-sm{padding:8px 12px;border:none;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;min-height:36px;}
.btn-red{background:rgba(244,63,94,0.1);border:1px solid rgba(244,63,94,0.2);color:var(--coral);}
.btn-green{background:linear-gradient(135deg,var(--green),#059669);color:#fff;box-shadow:0 4px 12px rgba(16,185,129,0.3);border:none;}
.btn-teal{background:var(--teal);color:#fff;box-shadow:0 4px 12px rgba(13,148,136,0.35);border:none;}
.btn-danger{background:linear-gradient(135deg,#f43f5e,#fb7185);color:#fff;border:none;box-shadow:0 4px 12px rgba(244,63,94,0.25);}

.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:rgba(15,23,42,0.97);border-top:1px solid var(--border);
  backdrop-filter:blur(20px);
  display:flex;
  padding:8px 0 max(8px,env(safe-area-inset-bottom,0px));
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--muted);font-size:10px;font-weight:500;padding:6px 4px;
  transition:color 0.2s;cursor:pointer;
}
.nav-item.active{color:var(--teal2);}
.nav-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:18px;transition:all 0.2s;}
.nav-item.active .nav-icon{background:rgba(13,148,136,0.15);}

.tab-content{display:none;}
.tab-content.active{display:block;}
.page-content{padding:16px;max-width:640px;margin:0 auto;}

.card{background:var(--navy2);border:1px solid var(--border);border-radius:20px;padding:20px;}
.card-sm{background:var(--navy3);border:1px solid var(--border);border-radius:16px;padding:16px;}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.kpi-card{border-radius:20px;padding:20px 18px;position:relative;overflow:hidden;}
.kpi-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.06),transparent 60%);}
.kpi-val{font-family:'Outfit',sans-serif;font-weight:800;font-size:24px;line-height:1.1;}
.kpi-lbl{font-size:11px;font-weight:500;opacity:0.75;margin-top:4px;text-transform:uppercase;letter-spacing:0.5px;}

.trip-header-card{background:linear-gradient(135deg,#0d9488,#0891b2);border:none;border-radius:20px;padding:20px;margin-bottom:16px;}
.list-item{background:var(--navy3);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;}
.avatar{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-weight:800;font-size:18px;flex-shrink:0;}
.section-title{font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;}

.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.b-teal{background:rgba(13,148,136,0.15);color:var(--teal2);}
.b-amber{background:rgba(245,158,11,0.15);color:var(--amber);}
.b-green{background:rgba(16,185,129,0.15);color:var(--green);}
.b-coral{background:rgba(244,63,94,0.15);color:var(--coral);}

.bal-pos{background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.2);border-radius:16px;padding:16px;margin-bottom:10px;}
.bal-neg{background:rgba(244,63,94,0.08);border:1px solid rgba(244,63,94,0.2);border-radius:16px;padding:16px;margin-bottom:10px;}
.bal-zero{background:rgba(148,163,184,0.05);border:1px solid rgba(148,163,184,0.12);border-radius:16px;padding:16px;margin-bottom:10px;}
.settle-card{background:var(--navy3);border:1.5px solid rgba(59,130,246,0.2);border-radius:20px;padding:20px;margin-bottom:12px;}

.empty{text-align:center;padding:48px 20px;}
.empty-icon{font-size:52px;margin-bottom:12px;opacity:0.5;}
.empty-title{font-family:'Outfit',sans-serif;font-size:18px;font-weight:600;color:var(--muted);margin-bottom:6px;}
.empty-sub{font-size:13px;color:#64748b;}

.sheet-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;align-items:flex-end;justify-content:center;}
.sheet-overlay.open{display:flex;}
.sheet{background:var(--navy2);border-radius:24px 24px 0 0;padding:24px 20px;width:100%;max-width:520px;padding-bottom:max(24px,env(safe-area-inset-bottom,24px));}
.sheet-handle{width:40px;height:4px;background:rgba(255,255,255,0.15);border-radius:4px;margin:0 auto 20px;}
.sheet-title{font-family:'Outfit',sans-serif;font-weight:800;font-size:20px;margin-bottom:20px;}
.split-row{display:flex;gap:8px;}
.split-opt{flex:1;padding:12px;border-radius:12px;border:2px solid rgba(255,255,255,0.1);background:transparent;color:var(--muted);font-weight:600;font-size:13px;transition:all 0.2s;cursor:pointer;}
.split-opt.active{border-color:var(--teal);background:rgba(13,148,136,0.15);color:var(--teal2);}

.currency-row{display:flex;align-items:center;gap:12px;background:var(--navy3);border:1px solid var(--border);border-radius:16px;padding:12px 16px;margin-bottom:16px;}
.currency-row label{font-size:13px;color:var(--muted);font-weight:600;flex-shrink:0;}
.currency-row select{flex:1;background:transparent;border:none;color:#fff;font-size:14px;outline:none;}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:16px;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(13,148,136,0.12);border:1px solid rgba(13,148,136,0.25);border-radius:50px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--teal2);cursor:pointer;white-space:nowrap;}
.chip.active-chip{background:rgba(13,148,136,0.22);border-color:var(--teal);}
.summary-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.sum-cell{background:var(--navy3);border:1px solid var(--border);border-radius:14px;padding:12px 10px;text-align:center;}
.sum-val{font-family:'Outfit',sans-serif;font-weight:800;font-size:14px;color:var(--teal2);}
.sum-lbl{font-size:10px;color:var(--muted);margin-top:2px;}
.trip-card{background:var(--navy3);border:1.5px solid var(--border);border-radius:20px;padding:18px;margin-bottom:12px;cursor:pointer;}
.trip-card.active-trip{background:rgba(13,148,136,0.1);border-color:var(--teal);}
.pdf-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:linear-gradient(135deg,var(--green),#059669);color:#fff;border:none;border-radius:12px;font-weight:600;font-size:13px;box-shadow:0 4px 14px rgba(16,185,129,0.3);cursor:pointer;}
.bal-stats{display:flex;gap:8px;margin-top:12px;}
.bal-stat{flex:1;background:rgba(255,255,255,0.06);border-radius:10px;padding:8px 10px;text-align:center;}
.bal-stat-val{font-size:13px;font-weight:700;}
.bal-stat-lbl{font-size:10px;color:var(--muted);margin-top:2px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
.fade-up{animation:fadeUp 0.3s ease forwards;}
.flex-row{display:flex;align-items:center;gap:12px;}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
</style>
</head>
<body>

<!-- AUTH PAGE -->
<div id="auth-page" class="page active">
  <div class="auth-card">
    <div class="auth-logo">&#127978;</div>
    <h1 class="auth-title">Picnic Trip Manager</h1>
    <p class="auth-sub">Smart group expense tracking</p>
    <div class="tab-row" id="auth-tabs">
      <button class="tab-btn active" onclick="switchAuthTab('login')">Sign In</button>
      <button class="tab-btn" onclick="switchAuthTab('signup')">Sign Up</button>
    </div>
    <div id="auth-alert" class="alert"></div>

    <!-- LOGIN -->
    <div id="form-login">
      <div class="form-group"><label class="field-label">Username</label><input class="field-input" id="login-user" type="text" placeholder="your_username"></div>
      <div class="form-group"><label class="field-label">Password</label><input class="field-input" id="login-pass" type="password" placeholder="••••••"></div>
      <button class="primary-btn" onclick="doLogin()">Sign In</button>
      <button class="link-btn" style="margin-top:12px;" onclick="switchAuthTab('reset')">Forgot password?</button>
    </div>

    <!-- SIGNUP -->
    <div id="form-signup" style="display:none;">
      <div class="form-group"><label class="field-label">Full Name</label><input class="field-input" id="su-name" type="text" placeholder="John Smith"></div>
      <div class="form-group"><label class="field-label">Email</label><input class="field-input" id="su-email" type="email" placeholder="john@email.com"></div>
      <div class="form-group"><label class="field-label">Username (4+ chars)</label><input class="field-input" id="su-user" type="text" placeholder="john123"></div>
      <div class="form-group"><label class="field-label">Security Question</label>
        <select class="field-input" id="su-sq">
          <option value="">Select question...</option>
          <option>What is your mother's maiden name?</option>
          <option>What was the name of your first pet?</option>
          <option>What city were you born in?</option>
          <option>What is your favorite color?</option>
          <option>What was your childhood nickname?</option>
        </select>
      </div>
      <div class="form-group"><label class="field-label">Security Answer</label><input class="field-input" id="su-sa" type="text" placeholder="Your answer"></div>
      <div class="form-group"><label class="field-label">Password (6+ chars)</label><input class="field-input" id="su-pass" type="password" placeholder="••••••"></div>
      <div class="form-group"><label class="field-label">Confirm Password</label><input class="field-input" id="su-cpass" type="password" placeholder="••••••"></div>
      <button class="primary-btn" onclick="doSignup()">Create Account</button>
    </div>

    <!-- RESET -->
    <div id="form-reset" style="display:none;">
      <div style="background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.2);border-radius:12px;padding:14px;margin-bottom:16px;font-size:12px;color:#93c5fd;">&#128273; Enter your username to recover your account</div>
      <div class="form-group"><label class="field-label">Username</label><input class="field-input" id="rs-user" type="text" placeholder="your_username" oninput="loadResetQ()"></div>
      <div id="rs-extra" style="display:none;">
        <div class="form-group"><label class="field-label">Security Question</label><div class="field-input" id="rs-sq" style="color:var(--muted);min-height:48px;display:flex;align-items:center;font-size:14px;"></div></div>
        <div class="form-group"><label class="field-label">Your Answer</label><input class="field-input" id="rs-sa" type="text" placeholder="Your answer"></div>
        <div class="form-group"><label class="field-label">New Password</label><input class="field-input" id="rs-pass" type="password" placeholder="••••••"></div>
        <div class="form-group"><label class="field-label">Confirm New Password</label><input class="field-input" id="rs-cpass" type="password" placeholder="••••••"></div>
      </div>
      <button class="primary-btn" onclick="doReset()">Reset Password</button>
      <button class="link-btn" style="margin-top:12px;" onclick="switchAuthTab('login')">Back to Sign In</button>
    </div>
  </div>
</div>

<!-- APP PAGE -->
<div id="app-page" class="page">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="flex-row">
        <div class="topbar-logo">&#127978;</div>
        <div>
          <div class="topbar-title">Picnic Manager</div>
          <div class="topbar-sub" id="topbar-hi">Welcome</div>
        </div>
      </div>
      <div class="flex-row" style="gap:8px;">
        <button class="pdf-btn" id="pdf-btn-top" onclick="generatePDF()" style="display:none;">&#128196;</button>
        <button class="btn-sm btn-red" onclick="doLogout()">Logout</button>
      </div>
    </div>
  </div>

  <div id="tab-home" class="tab-content active"><div class="page-content fade-up" id="home-content"></div></div>
  <div id="tab-people" class="tab-content"><div class="page-content fade-up" id="people-content"></div></div>
  <div id="tab-expenses" class="tab-content"><div class="page-content fade-up" id="expenses-content"></div></div>
  <div id="tab-settle" class="tab-content"><div class="page-content fade-up" id="settle-content"></div></div>
  <div id="tab-trips" class="tab-content"><div class="page-content fade-up" id="trips-content"></div></div>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('home')" id="nav-home"><div class="nav-icon">&#127968;</div><span>Home</span></button>
    <button class="nav-item" onclick="switchTab('people')" id="nav-people"><div class="nav-icon">&#128101;</div><span>People</span></button>
    <button class="nav-item" onclick="switchTab('expenses')" id="nav-expenses"><div class="nav-icon">&#128176;</div><span>Expenses</span></button>
    <button class="nav-item" onclick="switchTab('settle')" id="nav-settle"><div class="nav-icon">&#129309;</div><span>Settle</span></button>
    <button class="nav-item" onclick="switchTab('trips')" id="nav-trips"><div class="nav-icon">&#128218;</div><span>Trips</span></button>
  </nav>
</div>

<!-- SHEETS -->
<div class="sheet-overlay" id="sheet-trip" onclick="closeSheet('sheet-trip')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-title">New Trip &#127978;</div>
    <div class="form-group"><label class="field-label">Trip Name</label><input class="field-input" id="new-trip-name" type="text" placeholder="Weekend Picnic"></div>
    <div class="form-group"><label class="field-label">Date</label><input class="field-input" id="new-trip-date" type="date"></div>
    <button class="primary-btn" onclick="createTrip()">Create Trip</button>
    <button class="link-btn" style="margin-top:10px;" onclick="closeSheet('sheet-trip')">Cancel</button>
  </div>
</div>

<div class="sheet-overlay" id="sheet-person" onclick="closeSheet('sheet-person')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Add Participant</div>
    <div class="form-group"><label class="field-label">Name</label><input class="field-input" id="new-part-name" type="text" placeholder="Family name"></div>
    <div class="form-group"><label class="field-label">Number of Members</label><input class="field-input" id="new-part-members" type="number" min="1" value="1"></div>
    <button class="primary-btn" onclick="addParticipant()">Add</button>
    <button class="link-btn" style="margin-top:10px;" onclick="closeSheet('sheet-person')">Cancel</button>
  </div>
</div>

<div class="sheet-overlay" id="sheet-expense" onclick="closeSheet('sheet-expense')">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Add Expense</div>
    <div class="form-group"><label class="field-label">Description</label><input class="field-input" id="new-exp-desc" type="text" placeholder="Food, transport..."></div>
    <div class="form-group"><label class="field-label" id="exp-amt-label">Amount</label><input class="field-input" id="new-exp-amt" type="number" step="0.01" placeholder="0.00"></div>
    <div class="form-group"><label class="field-label">Paid By</label>
      <select class="field-input" id="new-exp-paidby"><option value="">Select person...</option></select>
    </div>
    <div class="form-group"><label class="field-label">Split Method</label>
      <div class="split-row">
        <button class="split-opt active" id="split-head" onclick="setSplit('perHead')">Per Head &#128100;</button>
        <button class="split-opt" id="split-fam" onclick="setSplit('perFamily')">Per Family &#128106;</button>
      </div>
    </div>
    <button class="primary-btn" onclick="addExpense()">Add Expense</button>
    <button class="link-btn" style="margin-top:10px;" onclick="closeSheet('sheet-expense')">Cancel</button>
  </div>
</div>

<script>
/* ============================================================
   STATE
============================================================ */
var currentUser = null;
var trips = [];
var currentTrip = null;
var splitType = 'perHead';
var currencies = [
  {code:'USD',symbol:'$',name:'US Dollar'},
  {code:'EUR',symbol:'€',name:'Euro'},
  {code:'GBP',symbol:'£',name:'British Pound'},
  {code:'SAR',symbol:'SAR ',name:'Saudi Riyal'},
  {code:'AED',symbol:'AED ',name:'UAE Dirham'},
  {code:'INR',symbol:'₹',name:'Indian Rupee'},
  {code:'JPY',symbol:'¥',name:'Japanese Yen'},
  {code:'CNY',symbol:'¥',name:'Chinese Yuan'},
  {code:'AUD',symbol:'A$',name:'Australian Dollar'},
  {code:'CAD',symbol:'C$',name:'Canadian Dollar'}
];
var currency = currencies[0];
var avatarColors = [
  ['#0d9488','#14b8a6'],['#3b82f6','#60a5fa'],['#f59e0b','#fbbf24'],
  ['#8b5cf6','#a78bfa'],['#f43f5e','#fb7185'],['#10b981','#34d399']
];

function doLogin(){
  clearAlert();
  var u = document.getElementById('login-user').value.trim();
  var p = document.getElementById('login-pass').value;
  if(!u||!p){ showAlert('Please enter username and password.'); return; }
  var users = JSON.parse(localStorage.getItem('picnicUsers')||'[]');
  var found=null; for(var i=0;i<users.length;i++){ if(users[i].username===u){ found=users[i]; break; } }
  if(!found){ showAlert('Username not found. Please sign up.'); return; }
  if(found.password!==p){ showAlert('Incorrect password.'); return; }
  showAlert('Welcome back, '+found.fullName+'!','ok');
  setTimeout(function(){ localStorage.setItem('currentUser',JSON.stringify(found)); startApp(found); }, 800);
}

function doSignup(){
  clearAlert();
  var name=document.getElementById('su-name').value.trim();
  var email=document.getElementById('su-email').value.trim();
  var user=document.getElementById('su-user').value.trim();
  var sq=document.getElementById('su-sq').value;
  var sa=document.getElementById('su-sa').value.trim();
  var pass=document.getElementById('su-pass').value;
  var cpass=document.getElementById('su-cpass').value;
  if(!name||!email||!user||!pass||!cpass){ showAlert('All fields are required.'); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showAlert('Invalid email address.'); return; }
  if(user.length<4){ showAlert('Username must be 4+ characters.'); return; }
  if(pass.length<6){ showAlert('Password must be 6+ characters.'); return; }
  if(pass!==cpass){ showAlert('Passwords do not match.'); return; }
  if(!sq||sa.length<2){ showAlert('Please complete security question.'); return; }
  var users=JSON.parse(localStorage.getItem('picnicUsers')||'[]');
  for(var i=0;i<users.length;i++){
    if(users[i].username===user){ showAlert('Username already taken.'); return; }
    if(users[i].email===email){ showAlert('Email already registered.'); return; }
  }
  var nu={id:Date.now(),fullName:name,email:email,username:user,password:pass,securityQuestion:sq,securityAnswer:sa.toLowerCase(),createdAt:new Date().toISOString()};
  users.push(nu); localStorage.setItem('picnicUsers',JSON.stringify(users));
  showAlert('Account created! Redirecting to login...','ok');
  setTimeout(function(){ switchAuthTab('login'); clearAlert(); }, 2500);
}

function doReset(){
  clearAlert();
  var u=document.getElementById('rs-user').value.trim();
  var sa=document.getElementById('rs-sa').value.trim();
  var pass=document.getElementById('rs-pass').value;
  var cpass=document.getElementById('rs-cpass').value;
  if(!u){ showAlert('Enter your username.'); return; }
  var users=JSON.parse(localStorage.getItem('picnicUsers')||'[]');
  var idx=-1; for(var i=0;i<users.length;i++){ if(users[i].username===u){ idx=i; break; } }
  if(idx===-1){ showAlert('Username not found.'); return; }
  if(!sa){ showAlert('Answer your security question.'); return; }

/* ============================================================
   COMPUTED
============================================================ */
function getParts(){ return (currentTrip&&currentTrip.participants)||[]; }
function getExps(){ return (currentTrip&&currentTrip.expenses)||[]; }
function totalExp(){ return getExps().reduce(function(s,e){ return s+e.amount; },0); }
function totalHeads(){ return getParts().reduce(function(s,p){ return s+p.familyMembers; },0); }
function cph(){ var h=totalHeads(); return h>0?totalExp()/h:0; }
function cpf(){ var f=getParts().length; return f>0?totalExp()/f:0; }

function calcBal(){
  var bal={};
  getParts().forEach(function(p){ bal[p.name]=0; });
  getExps().forEach(function(exp){
    var th=totalHeads(), tf=getParts().length;
    var spu=exp.splitType==='perHead'&&th>0?exp.amount/th:(tf>0?exp.amount/tf:0);
    getParts().forEach(function(p){
      var sh=exp.splitType==='perHead'?spu*p.familyMembers:spu;
      if(p.name===exp.paidBy) bal[p.name]+=exp.amount-sh; else bal[p.name]-=sh;
    });
  });
  return bal;
}

function calcSettlements(){
  if(!getParts().length||!getExps().length) return [];
  var bal=calcBal(), settlements=[];
  var debtors=[],creditors=[];
  Object.keys(bal).forEach(function(k){
    if(bal[k]<-0.001) debtors.push({name:k,amount:Math.abs(bal[k])});
    else if(bal[k]>0.001) creditors.push({name:k,amount:bal[k]});
  });
  var d=debtors.map(function(x){ return {name:x.name,amount:x.amount}; });
  var c=creditors.map(function(x){ return {name:x.name,amount:x.amount}; });
  var di=0,ci=0;
  while(di<d.length&&ci<c.length){
    var pay=Math.min(d[di].amount,c[ci].amount);
    if(pay>0.001) settlements.push({from:d[di].name,to:c[ci].name,amount:pay});
    d[di].amount-=pay; c[ci].amount-=pay;
    if(d[di].amount<0.001) di++;
    if(c[ci].amount<0.001) ci++;
  }
  return settlements;
}

    var paid=exps.filter(function(e){ return e.paidBy===p.name; }).reduce(function(s,e){ return s+e.amount; },0);
    var share=cpHead*p.familyMembers;
    var isPos=b>0.001, isNeg=b<-0.001;
    var cls=isPos?'bal-pos':isNeg?'bal-neg':'bal-zero';
    var bCol=isPos?'var(--green)':isNeg?'var(--coral)':'var(--muted)';

    html+='<div class="bal-stats">';

    html+='<div class="bal-stat"><div class="bal-stat-val">'+fmt(share)+'</div><div class="bal-stat-lbl">Total Share</div></div>';
    html+='<div class="bal-stat"><div class="bal-stat-val">'+fmt(paid)+'</div><div class="bal-stat-lbl">Paid</div></div>';
    html+='</div></div>';
  });
  html+='<div class="section-title" style="margin-top:24px;">&#128184; Transactions</div>';
  if(settlements.length===0){
    html+='<div style="background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.2);border-radius:20px;padding:32px;text-align:center;"><div style="font-size:48px;margin-bottom:12px;">&#9989;</div><div style="font-family:Outfit,sans-serif;font-weight:800;font-size:20px;color:var(--green);">All Settled!</div><div style="font-size:13px;color:var(--muted);margin-top:6px;">No payments needed</div></div>';
  } else {

      html+='<div class="settle-card">';
      html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">';
      html+='<div style="background:rgba(59,130,246,0.15);color:var(--blue);border-radius:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;">'+(i+1)+'</div>';
      html+='<div style="background:linear-gradient(135deg,var(--green),#059669);color:#fff;border-radius:50px;padding:6px 16px;font-family:Outfit,sans-serif;font-weight:800;font-size:16px;box-shadow:0 4px 12px rgba(16,185,129,0.35);">'+fmt(s.amount)+'</div>';
      html+='</div>';
      html+='<div style="display:flex;align-items:center;gap:10px;">';
      html+='<div style="flex:1;background:rgba(244,63,94,0.08);border:1px solid rgba(244,63,94,0.15);border-radius:14px;padding:12px;">';
      html+='<div style="font-size:10px;color:var(--coral);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;">FROM</div>';
      html+='<div style="font-weight:700;font-size:15px;">'+esc(s.from)+'</div><div style="font-size:11px;color:var(--muted);">Payer</div></div>';
      html+='<div style="font-size:20px;">&#8594;</div>';
      html+='<div style="flex:1;background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.15);border-radius:14px;padding:12px;">';
      html+='<div style="font-size:10px;color:var(--green);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;">TO</div>';
      html+='<div style="font-weight:700;font-size:15px;">'+esc(s.to)+'</div><div style="font-size:11px;color:var(--muted);">Receiver</div></div>';
      html+='</div></div>';
    });
  }
  el.innerHTML=html;
}

/* ============================================================
   RENDER: TRIPS
============================================================ */
function renderTrips(){
  var el=document.getElementById('trips-content');
  var html='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;"><div class="section-title" style="margin-bottom:0;">&#128218; All Trips</div><button class="btn-sm btn-teal" onclick="openSheet(\'sheet-trip\')">+ New</button></div>';
  if(trips.length===0){
    html+='<div class="empty"><div class="empty-icon">&#127978;</div><div class="empty-title">No trips yet</div><div class="empty-sub">Create your first trip!</div></div>';
  } else {
    trips.forEach(function(t){
      var tt=(t.expenses||[]).reduce(function(s,e){ return s+e.amount; },0);
      var tp=(t.participants||[]).length;
      var isActive=currentTrip&&t.id===currentTrip.id;
      html+='<div class="trip-card'+(isActive?' active-trip':'')+'" onclick="switchTrip('+t.id+')">';
      html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">';
      html+='<div><div style="font-family:Outfit,sans-serif;font-weight:800;font-size:18px;margin-bottom:4px;">'+esc(t.name)+'</div>';
      html+='<div style="font-size:12px;color:var(--muted);">&#128197; '+new Date(t.date).toLocaleDateString()+'</div></div>';
      html+='<button onclick="event.stopPropagation();deleteTrip('+t.id+')" class="btn-sm" style="background:rgba(244,63,94,0.1);border:1px solid rgba(244,63,94,0.2);color:var(--coral);padding:6px 10px;font-size:12px;">Delete</button>';
      html+='</div>';
      html+='<div style="display:flex;gap:8px;flex-wrap:wrap;">';
      html+='<span class="badge b-teal">&#128101; '+tp+' families</span>';
      html+='<span class="badge b-green">&#128176; '+currency.symbol+tt.toFixed(2)+'</span>';
      if(isActive) html+='<span class="badge b-amber">&#10003; Active</span>';
      html+='</div></div>';
    });
  }
  el.innerHTML=html;
}

/* ============================================================
   ACTIONS
============================================================ */
function changeCurrency(code){
  for(var i=0;i<currencies.length;i++){ if(currencies[i].code===code){ currency=currencies[i]; break; } }
  localStorage.setItem(cKey(),code);
  renderAll();
}

function createTrip(){
  var name=document.getElementById('new-trip-name').value.trim();
  var date=document.getElementById('new-trip-date').value;
  if(!name||!date){ alert('Please enter trip name and date.'); return; }
  var nt={id:Date.now(),name:name,date:date,participants:[],expenses:[],createdAt:new Date().toISOString()};
  trips.unshift(nt); currentTrip=nt;
  saveTrips(); closeSheet('sheet-trip');
  document.getElementById('new-trip-name').value='';
  document.getElementById('new-trip-date').value='';
  renderAll(); switchTab('home');
}

function switchTrip(id){
  for(var i=0;i<trips.length;i++){ if(trips[i].id===id){ currentTrip=trips[i]; break; } }
  renderAll(); switchTab('home');
}

function deleteTrip(id){
  if(!confirm('Delete this trip?')) return;
  trips=trips.filter(function(t){ return t.id!==id; });
  if(currentTrip&&currentTrip.id===id){ currentTrip=trips.length>0?trips[0]:null; }
  saveTrips(); renderAll();
}

function addParticipant(){
  var name=document.getElementById('new-part-name').value.trim();
  var members=parseInt(document.getElementById('new-part-members').value)||1;
  if(!name){ alert('Please enter a name.'); return; }
  if(!currentTrip) return;
  currentTrip.participants.push({id:Date.now(),name:name,familyMembers:members});
  saveTrips(); closeSheet('sheet-person');
  document.getElementById('new-part-name').value='';
  document.getElementById('new-part-members').value='1';
  renderAll();
}

function removeParticipant(id){
  if(!currentTrip) return;
  currentTrip.participants=currentTrip.participants.filter(function(p){ return p.id!==id; });
  saveTrips(); renderAll();
}

function openExpSheet(){
  var sel=document.getElementById('new-exp-paidby');
  sel.innerHTML='<option value="">Select person...</option>';
  getParts().forEach(function(p){
    var opt=document.createElement('option');
    opt.value=p.name; opt.textContent=p.name; sel.appendChild(opt);
  });
  document.getElementById('exp-amt-label').textContent='Amount ('+currency.symbol+')';
  openSheet('sheet-expense');
}

function setSplit(type){
  splitType=type;
  document.getElementById('split-head').className='split-opt'+(type==='perHead'?' active':'');
  document.getElementById('split-fam').className='split-opt'+(type==='perFamily'?' active':'');
}

function addExpense(){
  var desc=document.getElementById('new-exp-desc').value.trim();
  var amt=parseFloat(document.getElementById('new-exp-amt').value);
  var paidBy=document.getElementById('new-exp-paidby').value;
  if(!desc||!amt||!paidBy){ alert('Please fill in all fields.'); return; }
  if(!currentTrip) return;
  currentTrip.expenses.push({id:Date.now(),description:desc,amount:amt,paidBy:paidBy,splitType:splitType,date:new Date().toISOString()});
  saveTrips(); closeSheet('sheet-expense');
  document.getElementById('new-exp-desc').value='';
  document.getElementById('new-exp-amt').value='';
  document.getElementById('new-exp-paidby').value='';
  setSplit('perHead');
  renderAll();
}

function removeExpense(id){
  if(!currentTrip) return;
  currentTrip.expenses=currentTrip.expenses.filter(function(e){ return e.id!==id; });
  saveTrips(); renderAll();
}

function openSheet(id){ document.getElementById(id).classList.add('open'); }
function closeSheet(id){ document.getElementById(id).classList.remove('open'); }

/* ============================================================
   PDF GENERATION
============================================================ */
function generatePDF(){
  if(typeof window.jspdf==='undefined'){ alert('PDF library loading, please try again in a moment.'); return; }
  var jsPDF=window.jspdf.jsPDF;
  var doc=new jsPDF({orientation:'portrait',format:'a4'});
  var W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight();
  var M=14, CW=W-M*2;
  var y=0;
  var parts=getParts(), exps=getExps();
  var settlements=calcSettlements(), bal=calcBal();
  var cpHead=cph(), cpFam=cpf(), totExp=totalExp(), totHds=totalHeads();

  function checkY(sp){ if(y+sp>H-20){ doc.addPage(); y=20; } }

  // HEADER
  doc.setFillColor(15,23,42); doc.rect(0,0,W,46,'F');
  doc.setFillColor(13,148,136); doc.rect(0,43,W,3,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(18);
  doc.text((currentTrip.name+' - SETTLEMENT REPORT').toUpperCase(), W/2, 20, {align:'center'});
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(148,163,184);
  doc.text('Generated: '+new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}), W/2, 30, {align:'center'});
  doc.setTextColor(20,184,166);
  doc.text('Trip Date: '+new Date(currentTrip.date).toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'}), W/2, 38, {align:'center'});
  y=56;

  // KPI ROW
  var kpis=[
    {label:'Families',value:parts.length.toString(),accent:[13,148,136]},
    {label:'Total Heads',value:totHds.toString(),accent:[59,130,246]},
    {label:'Total Expenses',value:fmt(totExp),accent:[16,185,129]},
    {label:'Cost / Head',value:fmt(cpHead),accent:[139,92,246]}
  ];
  var kW=(CW-9)/4, kH=28, kG=3;
  kpis.forEach(function(k,i){
    var kx=M+i*(kW+kG);
    doc.setFillColor(30,41,59); doc.roundedRect(kx,y,kW,kH,2,2,'F');
    doc.setFillColor(k.accent[0],k.accent[1],k.accent[2]); doc.roundedRect(kx,y,kW,2.5,2,2,'F');
    doc.setTextColor(k.accent[0],k.accent[1],k.accent[2]); doc.setFontSize(11); doc.setFont('helvetica','bold');
    doc.text(k.value, kx+kW/2, y+15, {align:'center',maxWidth:kW-4});
    doc.setTextColor(148,163,184); doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(k.label, kx+kW/2, y+23, {align:'center'});
  });
  y+=kH+14;

  function sectionHdr(title, r,g,b){
    checkY(16);
    doc.setFillColor(15,23,42); doc.rect(M,y,CW,10,'F');
    doc.setFillColor(r,g,b); doc.rect(M,y,3,10,'F');
    doc.setTextColor(r,g,b); doc.setFontSize(12); doc.setFont('helvetica','bold');
    doc.text(title, M+7, y+7);
    y+=14;
  }

  // PARTICIPANTS OVERVIEW
  sectionHdr('PARTICIPANTS OVERVIEW', 13,148,136);
  var pCols=Math.min(3,parts.length)||1;
  var pCW=(CW-(pCols-1)*3)/pCols, pCH=32;
  var rowY=y;
  parts.forEach(function(p,i){
    var col=i%pCols;
    if(col===0&&i>0){ rowY+=pCH+3; y=rowY; }
    checkY(pCH+3);
    var px=M+col*(pCW+3), py=rowY;
    var paid=exps.filter(function(e){ return e.paidBy===p.name; }).reduce(function(s,e){ return s+e.amount; },0);
    var share=exps.reduce(function(s,exp){
      var th=parts.reduce(function(ss,pp){ return ss+pp.familyMembers; },0);
      var spu=exp.splitType==='perHead'&&th>0?exp.amount/th:(parts.length>0?exp.amount/parts.length:0);
      return s+(exp.splitType==='perHead'?spu*p.familyMembers:spu);
    },0);
    var b=bal[p.name]||0;
    var isPos=b>0.001, isNeg=b<-0.001;
    var bg=isPos?[240,253,244]:isNeg?[255,241,242]:[248,250,252];
    var ac=isPos?[16,185,129]:isNeg?[244,63,94]:[148,163,184];
    doc.setFillColor(bg[0],bg[1],bg[2]); doc.roundedRect(px,py,pCW,pCH,2,2,'F');
    doc.setFillColor(ac[0],ac[1],ac[2]); doc.roundedRect(px,py,pCW,2,2,2,'F');
    doc.setTextColor(15,23,42); doc.setFontSize(9); doc.setFont('helvetica','bold');
    doc.text(p.name.length>14?p.name.substring(0,12)+'..':p.name, px+4, py+8);
    doc.setTextColor(100,116,139); doc.setFontSize(6.5); doc.setFont('helvetica','normal');
    doc.text(p.familyMembers+' member'+(p.familyMembers>1?'s':''), px+4, py+13);
    doc.setTextColor(100,116,139); doc.text('Paid:', px+4, py+19);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','bold'); doc.text(fmt(paid), px+14, py+19);
    doc.setFont('helvetica','normal'); doc.setTextColor(100,116,139); doc.text('Share:', px+4, py+23.5);
    doc.setTextColor(15,23,42); doc.setFont('helvetica','bold'); doc.text(fmt(share), px+14, py+23.5);
    doc.setFillColor(ac[0],ac[1],ac[2]); doc.roundedRect(px+2,py+pCH-7,pCW-4,6,1,1,'F');
    doc.setTextColor(255,255,255); doc.setFontSize(6.5);
    var st=isPos?'RECEIVE '+fmt(b):isNeg?'PAY '+fmt(Math.abs(b)):'SETTLED';
    doc.text(st, px+pCW/2, py+pCH-3, {align:'center'});
  });
  y=rowY+pCH+16;

  // EXPENSE DETAILS TABLE
  sectionHdr('EXPENSE DETAILS ('+exps.length+' ENTRIES)', 59,130,246);
  if(exps.length===0){
    doc.setTextColor(148,163,184); doc.setFontSize(10); doc.text('No expenses recorded.', M, y+6); y+=16;
  } else {
    checkY(12);
    // Header row
    doc.setFillColor(30,41,59); doc.roundedRect(M,y,CW,9,1,1,'F');
    doc.setFillColor(59,130,246); doc.roundedRect(M,y,CW,2,1,1,'F');
    doc.setTextColor(148,163,184); doc.setFontSize(7); doc.setFont('helvetica','bold');
    var cols={no:M,desc:M+9,paid:M+61,split:M+91,spu:M+114,amt:M+CW};
    doc.text('#', cols.no+4, y+6, {align:'center'});
    doc.text('DESCRIPTION', cols.desc+2, y+6);
    doc.text('PAID BY', cols.paid+2, y+6);
    doc.text('SPLIT', cols.split+2, y+6);
    doc.text('PER HEAD', cols.spu+2, y+6);
    doc.text('AMOUNT', cols.amt-2, y+6, {align:'right'});
    y+=11;
    var runTotal=0;
    exps.forEach(function(exp,i){
      checkY(10);
      var th=parts.reduce(function(s,p){ return s+p.familyMembers; },0);
      var spu=exp.splitType==='perHead'&&th>0?exp.amount/th:(parts.length>0?exp.amount/parts.length:0);
      runTotal+=exp.amount;
      doc.setFillColor(i%2===0?30:26, i%2===0?41:36, i%2===0?59:52);
      doc.rect(M,y-2,CW,10,'F');
      doc.setTextColor(148,163,184); doc.setFontSize(7.5); doc.setFont('helvetica','bold');
      doc.text(String(i+1), cols.no+4, y+5, {align:'center'});
      doc.setFont('helvetica','normal'); doc.setTextColor(220,220,220);
      doc.text(exp.description.length>26?exp.description.substring(0,24)+'..':exp.description, cols.desc+2, y+5);
      doc.setTextColor(148,163,184);
      doc.text(exp.paidBy.length>13?exp.paidBy.substring(0,11)+'..':exp.paidBy, cols.paid+2, y+5);
      doc.text(exp.splitType==='perHead'?'Per Head':'Per Fam.', cols.split+2, y+5);
      doc.text(fmt(spu), cols.spu+2, y+5);
      doc.setTextColor(13,148,136); doc.setFont('helvetica','bold');
      doc.text(fmt(exp.amount), cols.amt-2, y+5, {align:'right'});
      y+=10;
    });
    // Total row
    checkY(12);
    doc.setFillColor(13,148,136); doc.roundedRect(M,y,CW,11,1,1,'F');
    doc.setTextColor(255,255,255); doc.setFontSize(8.5); doc.setFont('helvetica','bold');
    doc.text('TOTAL', M+4, y+7.5);
    doc.text(fmt(runTotal), M+CW-2, y+7.5, {align:'right'});
    doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text('Cost/Head: '+fmt(cpHead)+'   Cost/Family: '+fmt(cpFam), W/2, y+7.5, {align:'center'});
    y+=18;

    // PER-PARTICIPANT BREAKDOWN
    sectionHdr('PER-PARTICIPANT EXPENSE BREAKDOWN', 139,92,246);
    parts.forEach(function(p){
      checkY(36);
      doc.setFillColor(30,41,59); doc.roundedRect(M,y,CW,9,1,1,'F');
      doc.setTextColor(220,220,220); doc.setFontSize(9); doc.setFont('helvetica','bold');
      doc.text(p.name+' ('+p.familyMembers+' member'+(p.familyMembers>1?'s':'')+')', M+4, y+6.5);
      doc.setTextColor(13,148,136);
      doc.text('Share: '+fmt(cpHead*p.familyMembers), M+CW-2, y+6.5, {align:'right'});
      y+=11;
      exps.forEach(function(exp,ei){
        checkY(9);
        var th=parts.reduce(function(s,pp){ return s+pp.familyMembers; },0);
        var spu=exp.splitType==='perHead'&&th>0?exp.amount/th:(parts.length>0?exp.amount/parts.length:0);
        var myShare=exp.splitType==='perHead'?spu*p.familyMembers:spu;
        var iPaid=exp.paidBy===p.name;
        doc.setFillColor(ei%2===0?26:30, ei%2===0?36:41, ei%2===0?52:59);
        doc.rect(M,y-1,CW,9,'F');
        doc.setTextColor(148,163,184); doc.setFontSize(7.5); doc.setFont('helvetica','normal');
        var dn=exp.description.length>32?exp.description.substring(0,30)+'..':exp.description;
        doc.text(dn, M+6, y+5);
        if(iPaid){ doc.setTextColor(16,185,129); doc.setFontSize(6.5); doc.text('[PAID]', M+CW-28, y+5); }
        if(iPaid) doc.setTextColor(16,185,129); else doc.setTextColor(200,200,200);
        doc.setFont('helvetica','bold'); doc.setFontSize(8);
        doc.text(fmt(myShare), M+CW-2, y+5, {align:'right'});
        y+=9;
      });
      y+=6;
    });
  }

  // SETTLEMENT TRANSACTIONS
  if(settlements.length>0){
    sectionHdr('SETTLEMENT TRANSACTIONS', 245,158,11);
    settlements.forEach(function(s,i){
      checkY(30);
      doc.setFillColor(30,41,59); doc.roundedRect(M,y,CW,26,2,2,'F');
      doc.setFillColor(59,130,246); doc.roundedRect(M,y,3,26,2,2,'F');
      doc.setFillColor(59,130,246); doc.circle(M+11,y+13,5,'F');
      doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
      doc.text(String(i+1), M+11, y+15, {align:'center'});
      doc.setFillColor(254,226,226); doc.roundedRect(M+19,y+4,50,18,2,2,'F');
      doc.setTextColor(127,29,29); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
      doc.text('FROM', M+22, y+10);
      doc.setTextColor(30,30,30); doc.setFontSize(9);
      doc.text(s.from.length>13?s.from.substring(0,11)+'..':s.from, M+22, y+17);
      var ax=W/2;
      doc.setFillColor(16,185,129); doc.roundedRect(ax-18,y+9,36,10,2,2,'F');
      doc.setTextColor(255,255,255); doc.setFontSize(9); doc.setFont('helvetica','bold');
      doc.text(fmt(s.amount), ax, y+15.5, {align:'center'});
      doc.setDrawColor(59,130,246); doc.setLineWidth(1);
      doc.line(M+70,y+14,ax-20,y+14); doc.line(ax+19,y+14,ax+40,y+14);
      doc.setFillColor(220,252,231); doc.roundedRect(ax+42,y+4,50,18,2,2,'F');
      doc.setTextColor(20,83,45); doc.setFontSize(6.5); doc.setFont('helvetica','bold');
      doc.text('TO', ax+45, y+10);
      doc.setTextColor(30,30,30); doc.setFontSize(9);
      doc.text(s.to.length>13?s.to.substring(0,11)+'..':s.to, ax+45, y+17);
      y+=32;
    });
  } else if(parts.length>0&&exps.length>0){
    checkY(24);
    doc.setFillColor(240,253,244); doc.roundedRect(M,y,CW,18,2,2,'F');
    doc.setTextColor(6,95,70); doc.setFontSize(12); doc.setFont('helvetica','bold');
    doc.text('All Settled! No payments needed.', W/2, y+11, {align:'center'});
    y+=26;
  }

  // FOOTER
  var totalPg=doc.internal.getNumberOfPages();
  for(var pg=1;pg<=totalPg;pg++){
    doc.setPage(pg);
    doc.setFillColor(15,23,42); doc.rect(0,H-14,W,14,'F');
    doc.setTextColor(148,163,184); doc.setFontSize(7.5); doc.setFont('helvetica','normal');
    doc.text('Picnic Trip Manager', M, H-5);
    doc.text(currentTrip.name, W/2, H-5, {align:'center'});
    doc.text('Page '+pg+' / '+totalPg, W-M, H-5, {align:'right'});
  }

  doc.save(currentTrip.name.replace(/[^a-z0-9]/gi,'_').toLowerCase()+'_report.pdf');
}
</script>
